name: Build Web Static

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "web/**"
      - "mitmproxy/**"
      - ".github/workflows/build-web.yml"

jobs:
  build-web:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run ci-build-release

      - name: Check build output
        run: |
          echo "workspace:"
          pwd

          echo "find generated files:"
          find . -path "*/tools/web/index.html" -o -path "*/tools/web/static"

      - name: Prepare web static
        run: |
          echo "prepare tools/web"

          # 删除旧文件
          rm -rf tools/web

          mkdir -p tools

          # 从构建目录复制回来
          cp -r mitmproxy/tools/web tools/

          echo "result:"
          ls -lah tools/web
          ls -lah tools/web/static

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tools/web

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update web static"

          git push